<!DOCTYPE html>
<html>
<head>
<title>Day 3 - Quotes | MPSU</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px;
    transition: background 0.8s ease;
  }
 .container {
    text-align: center;
    width: 100%;
    max-width: 600px;
  }
  h2 {
    color: white;
    letter-spacing: 1px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    margin-bottom: 25px;
  }
  #quoteBox {
    background: rgba(255,255,255,0.95);
    padding: 40px 35px;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    position: relative;
    animation: fadeIn 0.5s ease;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  #quoteBox::before {
    content: '"';
    font-size: 120px;
    color: #667eea;
    opacity: 0.1;
    position: absolute;
    top: -10px;
    left: 20px;
    font-family: Georgia;
  }
  #quote {
    font-size: 22px;
    font-weight: 600;
    color: #2d3748;
    line-height: 1.5;
    z-index: 1;
    transition: all 0.3s ease;
  }
  #author {
    margin-top: 15px;
    color: #764ba2;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 1;
  }
  button {
    padding: 14px 35px;
    background: white;
    color: #764ba2;
    border: none;
    border-radius: 50px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    margin-top: 30px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
  }
  button:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.3);
    background: #2d3748;
    color: white;
  }
  button:active { transform: scale(0.95); }
 .footer { color: rgba(255,255,255,0.8); font-size: 12px; margin-top: 20px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
 .animate {
    animation: pop 0.4s ease;
  }
  @keyframes pop {
    0% { transform: scale(0.95); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body id="bodyBg">

<div class="container">
  <h2>✨ Daily Inspiration -  IHHS</h2>
  <div id="quoteBox">
    <p id="quote">Click the button to get inspired.</p>
    <small id="author">IHHS</small>
  </div>
  <button onclick="newQuote()">🎲 New Quote</button>
  <p class="footer">Day 3 - JavaScript Random Quotes Generator</p>
</div>

<script>
const quotes = [
  { text: "The future belongs to those who believe in their dreams.", author: "Eleanor Roosevelt" },
  { text: "Always choose to be happy even if life gets tough.", author: "Princes Awao" },
  { text: "Even when it's hard, but keep fighting until graduation.", author: "Kelly Baguingan" },
  { text: "Education is the passport to the future, for tomorrow belongs to those who prepare for it today.", author: "Malcolm X" },
  { text: "Kids this days don't know peak.(sad emoji)", author: "Alayda Fongayao" },
  { text: "Meh.(thumbs down)", author: "Shaun Gayle Corcha" },
  { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" }
];

const backgrounds = [
  "linear-gradient(135deg, #667eea 0%, #764ba2 100%)",
  "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)",
  "linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)",
  "linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)",
  "linear-gradient(135deg, #fa709a 0%, #fee140 100%)",
  "linear-gradient(135deg, #30cfd0 0%, #330867 100%)",
  "linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)"
];

function newQuote() {
  let randomIndex = Math.floor(Math.random() * quotes.length);
  let colorIndex = Math.floor(Math.random() * backgrounds.length);

  let box = document.getElementById("quoteBox");

  // restart animation
  box.classList.remove("animate");
  void box.offsetWidth; // trick to restart
  box.classList.add("animate");

  document.getElementById("quote").innerHTML = `"${quotes[randomIndex].text}"`;
  document.getElementById("author").innerHTML = "— " + quotes[randomIndex].author;

  // change background color
  document.getElementById("bodyBg").style.background = backgrounds[colorIndex];
}
</script>

</body>
</html>orIndex];
}
</script>

</body>
</html>
