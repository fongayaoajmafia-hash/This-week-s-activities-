<!DOCTYPE html>
<html><head><title>Day 2 - Search</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{margin:0; min-height:100vh; font-family:Segoe UI, Arial; background:linear-gradient(180deg, #FFD93D 0%, #FF9A3C 30%, #FF6B35 60%, #2D1B4E 100%); display:flex; align-items:center; justify-content:center; padding:20px;}
 .card{background:rgba(255,255,255,0.95); padding:30px; border-radius:20px; box-shadow:0 15px 35px rgba(0,0,0,0.3); max-width:500px; width:100%;}
  h2{color:#2D1B4E; text-align:center;} input{width:100%; padding:12px; border-radius:10px; border:2px solid #FFD93D; outline:none;}
  input:focus{border-color:#FF6B35;} li{list-style:none; padding:10px; border-bottom:1px solid #ffe9a8; border-radius:8px; margin-top:5px; color:#2D1B4E;} a{color:#2D1B4E; font-size:13px; text-decoration:none; opacity:0.7;}
</style>
</head><body>
<div class="card">
  <h2>🔍 Day 2: Live Search</h2>
  <input type="text" id="searchBox" placeholder="Search subjects..." oninput="search()">
  <ul id="myList" style="padding:0;">
    <li>BSIT - Information Technology</li>
    <li>BS Education - Elementary Education</li>
    <li>BS Agriculture</li>
    <li>BS Criminology</li>
    <li>BS Accountancy</li>
    <li>Bontoc Culture</li>
    <li>Mountain Province History</li>
  </ul>
  <div style="text-align:center; margin-top:20px;"><a href="day1.html">← Day 1</a> | <a href="day3.html">Next → Day 3</a></div>
</div>
<script>
function search(){
  let filter=document.getElementById("searchBox").value.toLowerCase();
  let items=document.getElementById("myList").getElementsByTagName("li");
  for(let i=0;i<items.length;i++){
    items[i].style.display=items[i].innerText.toLowerCase().includes(filter)?"":"none";
  }
}
</script>
</body></html>
